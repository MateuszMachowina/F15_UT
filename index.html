<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FIFA 15 UT Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Logo instead of title -->
  <div id="main-logo" style="text-align: center; margin: 60px 0;">
    <img src="assets/ui/main_logo.png" alt="Pack Simulator">
  </div>

  <!-- Main menu -->
  <div id="menu">
    <img id="pack-img" src="assets/ui/pack.png" alt="Pack" onclick="openPack()">
    <div id="pack-price">50,000 coins</div>
  </div>

  <!-- Pack container with cards and action buttons -->
  <div id="pack-container">
    <div id="cards" class="cards"></div>

    <!-- Back button -->
    <img id="back-btn" src="assets/ui/back.png" alt="Back" onclick="resetPack()">

    <!-- Save button as image -->
    <img id="save-btn" src="assets/ui/save.png" alt="Save pack">
  </div>

  <!-- Club screen: browse, filter and quick-sell cards (CLB-02..04, CLB-06, ECO-02, ECO-03) -->
  <div id="club-container">
    <div id="club-toolbar">
      <input id="club-search" type="search" placeholder="Search player..." autocomplete="off" aria-label="Search player">
      <select id="club-pos" aria-label="Position"></select>
      <select id="club-ver" aria-label="Version"></select>
      <select id="club-league" aria-label="League"></select>
      <select id="club-club" aria-label="Club"></select>
      <select id="club-nation" aria-label="Nation"></select>
      <select id="club-rat" aria-label="Minimum rating">
        <option value="">Any rating</option>
        <option value="80">80+</option>
        <option value="85">85+</option>
        <option value="90">90+</option>
        <option value="95">95+</option>
      </select>
      <select id="club-sort" aria-label="Sort by">
        <option value="rat-desc">Rating high to low</option>
        <option value="rat-asc">Rating low to high</option>
        <option value="price-desc">Price high to low</option>
        <option value="price-asc">Price low to high</option>
        <option value="name">Name A-Z</option>
        <option value="count-desc">Most copies</option>
      </select>
      <button id="club-reset" type="button">Reset</button>
      <label class="club-check"><input type="checkbox" id="club-dupes"> Only duplicates</label>
      <button id="club-sell-dupes" type="button">Sell duplicates</button>
    </div>
    <div id="club-info"></div>
    <div id="club-scroll">
      <div id="club-grid"></div>
      <div id="club-empty"></div>
      <button id="club-more" type="button">Show more</button>
    </div>
  </div>

  <!-- Squad screen: teams, formation picker and pitch over team.png (SQD-01, SQD-02, SQD-06) -->
  <div id="squad-container">
    <div id="squad-topbar">
      <aside id="squad-side">
        <div class="squad-side-head">
          <span>Teams</span>
          <button id="squad-new" type="button">Create team</button>
        </div>
        <div id="squad-list"></div>
      </aside>

      <div id="squad-controls">
        <div id="squad-toolbar">
          <span id="squad-label">Formation</span>
          <div id="squad-formations"></div>
        </div>
        <div id="squad-summary"></div>
      </div>
    </div>

    <div id="squad-pitch"></div>
  </div>

  <!-- Player picker for the selected squad slot (SQD-02) -->
  <div id="squad-picker">
    <div class="picker-box">
      <div class="picker-head">
        <span id="picker-title">Select player</span>
        <button id="picker-close" type="button" aria-label="Close">✕</button>
      </div>
      <div class="picker-tools">
        <input id="picker-search" type="search" placeholder="Search name..." autocomplete="off" aria-label="Search player">
        <select id="picker-position" aria-label="Position"></select>
        <select id="picker-league" aria-label="League"></select>
        <select id="picker-club" aria-label="Club"></select>
        <select id="picker-nation" aria-label="Nation"></select>
        <label class="picker-check"><input type="checkbox" id="picker-only-fit" checked> Only compatible</label>
        <button id="picker-clear" type="button">Clear position</button>
      </div>
      <div id="picker-grid"></div>
      <button id="picker-more" type="button">Show more</button>
    </div>
  </div>

  <!-- Dark bar behind the bottom navigation (Club screen) -->
  <div id="nav-backdrop" aria-hidden="true"></div>

  <!-- Bottom navigation (TECH-04) -->
  <nav id="nav">
    <button id="nav-menu" class="active" type="button" onclick="showView('menu')">📦 Packs</button>
    <button id="nav-club" type="button" onclick="openClub()">🃏 Club</button>
    <button id="nav-squad" type="button" onclick="openSquad()">⚽ Squad</button>
  </nav>

  <!-- HUD: coins balance and club size (ECO-01, CLB-01) -->
  <div id="hud">
    <div class="hud-item" title="Coins"><span class="hud-icon">💰</span><span id="hud-coins">0</span></div>
    <div class="hud-item" title="Club: unique cards"><span class="hud-icon">🃏</span><span id="hud-club">0</span></div>
    <div id="hud-warn" title="Browser is blocking localStorage. Club will not be saved.">⚠ save unavailable</div>
    <button id="reset-save" type="button">Reset save</button>
  </div>

  <!-- Save/storage logic (must load before script.js) -->
  <script src="storage.js"></script>

  <!-- Shared card rendering (packs + club) -->
  <script src="cards.js"></script>

  <!-- Main JavaScript -->
  <script src="script.js"></script>

  <!-- Club screen and quick sell -->
  <script src="club.js"></script>

  <!-- Squad screen: formations and pitch (SQD-01) -->
  <script src="squad.js"></script>
  
  <!-- Share on X button -->
  <a id="share-btn" 
    href="https://twitter.com/intent/tweet?text=Check%20out%20%23MyFIFA15Pack!" 
    target="_blank" 
    rel="noopener noreferrer">
    <img src="assets/ui/x.png" alt="Share on X" />
  </a>
  
  <!-- html2canvas library to capture screenshots -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <!-- Pack save screenshot logic -->
  <script>
    const saveBtn = document.getElementById('save-btn');
    const shareHashtag = document.getElementById('share-btn');
    
    saveBtn.addEventListener('click', () => {
      /*shareHashtag.style.opacity = '0';*/

      // Take screenshot of entire body to capture background, logo, and opened pack
      html2canvas(document.body).then(canvas => {
        const link = document.createElement('a');
        link.download = 'my_pack.png';  // default download filename
        link.href = canvas.toDataURL();
        link.click();

        // Ensure save button remains visible after screenshot
        /*shareHashtag.style.opacity = '1';*/
        saveBtn.style.display = 'block';
      });
    });
  </script>

  <script>
    function toggleLogoVisibility() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const logo = document.getElementById('main-logo');
      const ua = navigator.userAgent || navigator.vendor || window.opera;
  
      // Hide logo only on iPads (7th–11th gen) based on Safari viewport dimensions
      if (/iPad/.test(ua) || (navigator.platform === 'MacIntel' && 'ontouchend' in document)) {
          // iPad w Safari
          logo.style.opacity = "0";
        } else {
          logo.style.opacity = "1";
        }
    }
  
    // Run once on page load
    toggleLogoVisibility();
  
    // Run again whenever the window is resized
    window.addEventListener("resize", toggleLogoVisibility);
  </script>


  <!-- Author signature linking to GitHub -->
  <a href="https://github.com/MateuszMachowina" target="_blank" id="author-sign">© 2026 MateuszMachowina</a>

  <!-- Spotify button in top-right corner -->
  <a href="https://open.spotify.com/playlist/00i82lDzMDdiHWNjrIGAyw" target="_blank" 
    id="spotify-btn">
    <img src="assets/ui/spotify.png" alt="Spotify Playlist">
  </a>

</body>
</html>
